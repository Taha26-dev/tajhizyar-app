# حافظه محدود سندباکس: کل رم ~4GB است؛ -Xmx8G پیش‌فرض باعث OOM-kill می‌شد
# توجه: HeapDumpOnOutOfMemoryError حذف شد (یک hprof یک گیگابایتی دیسک را پر کرده بود)
org.gradle.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
# Kotlin daemon جداگانه اجرا می‌شود؛ سهم حافظه آن را هم محدود می‌کنیم
kotlin.daemon.jvmargs=-Xmx384M
# محدودسازی موازی‌سازی برای کاهش مصرف همزمان حافظه
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
kotlin.compiler.execution.strategy=in-process

# جلوگیری از دانلود خودکار NDK/SDK توسط AGP — همه کامپوننت‌ها از قبل نصب‌اند
